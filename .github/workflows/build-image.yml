# Builds the homelab container image and pushes it to GHCR.
#
# Tags are `homelab-*`, not `v*`: upstream already uses v0.1.x, and a synced
# upstream tag must never collide with a homelab build. homelab-k8s pins an
# exact tag in kustomization.yaml, never :latest.
#
#   tag homelab-1 on this fork  ->  ghcr.io/<owner>/gods-eye-view:homelab-1
name: build-image

on:
  push:
    tags:
      - 'homelab-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The K3s nodes are VMs on Proxmox — amd64 only.
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gods-eye-view:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
